<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="들은 과목을 톡. 경희대 소프트웨어융합학과 졸업까지 남은 길을 퀘스트 지도로 확인하는 모바일 웹앱">
<meta name="theme-color" content="#720e28" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2a0f19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="졸업 원정대">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23820d30'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle'%3E%F0%9F%8F%B0%3C/text%3E%3C/svg%3E">
<title>졸업 원정대 · 경희졸업길잡이</title>
<style>
:root{
  --bg:#ece2e5;--surface:#fbf7f5;--card:#fff;--ink:#39232b;--muted:#6e5a62;--line:#eadbe0;--line-strong:#dcc4cd;
  --brand:#820d30;--brand-deep:#720e28;--brand-ink:#fff;--brand-soft:#f9e5ec;--brand-soft-2:#fff0f4;--brand-line:#d796ab;
  --gold:#f0ce76;--gold-soft:#fff5d4;--gold-deep:#d2ad54;--gray-orb:#f3eff0;--gray-line:#dfd6d9;--gray-deep:#c9b9bf;
  --ok:#2f7d4f;--warn-bg:#fff6e0;--warn-ink:#6b4a00;--shadow:0 15px 70px #72122e20;--overlay:#30101d80;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f0709;--surface:#1a0e13;--card:#24151b;--ink:#f4e8ec;--muted:#bba6ae;--line:#3a252d;--line-strong:#4c3039;
    --brand:#c23b64;--brand-deep:#2a0f19;--brand-ink:#fff;--brand-soft:#3c1a26;--brand-soft-2:#2e1620;--brand-line:#8e3a55;
    --gold:#b8913a;--gold-soft:#3a2f17;--gold-deep:#8a6a22;--gray-orb:#2a1d22;--gray-line:#3d2b32;--gray-deep:#1b1215;
    --ok:#6fcf97;--warn-bg:#3a2f17;--warn-ink:#f3d58a;--shadow:none;--overlay:#000a;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:480px;margin:auto;min-height:100dvh;background:var(--surface);position:relative;overflow-x:hidden}
/* header */
.top{background:var(--brand-deep);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 20px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top small{color:#e9c8d0;font-weight:700;letter-spacing:2px;font-size:10px}
.top h1{margin:6px 0 4px;font-size:26px;letter-spacing:-1px}
.top p{color:#f3dde3;font-size:13px;margin:0}
.chip{border:1px solid #ffffff55;background:#ffffff1a;color:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700;white-space:nowrap;min-height:36px}
.banner{margin:12px 16px 0;background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.6}
main{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
/* hero */
.hero{margin:16px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*360deg),var(--line) 0);display:grid;place-items:center;transition:--p .4s}
.ring>div{width:74px;height:74px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.ring b{font-size:22px;letter-spacing:-.5px;display:block}
.ring small{font-size:10px;color:var(--muted)}
.hero h2{margin:0 0 4px;font-size:16px}
.muted{font-size:12px;color:var(--muted);line-height:1.6}
.bar{height:8px;background:var(--line);border-radius:10px;margin:8px 0 4px;overflow:hidden}
.bar i{display:block;background:var(--brand);height:100%;border-radius:10px;transition:width .4s}
.next{grid-column:1/-1;width:100%;background:var(--brand);color:var(--brand-ink);border:0;border-radius:14px;padding:14px;font-size:14px;font-weight:800;min-height:48px}
/* map */
.map{list-style:none;margin:0;position:relative;padding:28px 18px 0}
.map:before{content:'';position:absolute;top:50px;bottom:40px;left:50%;width:4px;margin-left:-2px;background:repeating-linear-gradient(to bottom,var(--line-strong) 0 8px,transparent 8px 16px)}
.stop{position:relative;display:flex;align-items:center;gap:14px;margin-bottom:22px}
.stop.rev{flex-direction:row-reverse}
.orb-wrap{--p:0;flex-shrink:0;padding:4px;border-radius:30px;background:conic-gradient(var(--ringc,var(--gray-line)) calc(var(--p)*360deg),var(--gray-line) 0)}
.orb{width:72px;height:72px;border:0;background:var(--gray-orb);box-shadow:0 5px 0 var(--gray-deep);border-radius:26px;display:grid;place-items:center;font-size:32px;position:relative;transition:transform .15s}
.orb:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gray-deep)}
.orb .emo{filter:grayscale(1);opacity:.7;transition:.35s}
.st-partial .orb-wrap{--ringc:var(--gold)}
.st-partial .orb{background:var(--gold-soft);box-shadow:0 5px 0 var(--gold-deep)}
.st-partial .orb .emo,.st-done .orb .emo{filter:none;opacity:1}
.st-done .orb-wrap{--ringc:var(--brand)}
.st-done .orb{background:var(--brand-soft);box-shadow:0 5px 0 var(--brand)}
.badge{position:absolute;right:-8px;top:-8px;border:3px solid var(--surface);border-radius:50%;background:var(--brand);color:#fff;font-size:13px;width:26px;height:26px;display:grid;place-items:center;font-weight:800}
.st-unknown .badge{background:var(--muted)}
.label{flex:1;max-width:260px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;min-height:72px}
.label b{display:block;font-size:14px}
.label small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.label .meta{display:block;font-size:12px;margin-top:4px;font-weight:600}
.mini{display:block;height:4px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--brand);border-radius:4px}
.st-partial .mini i{background:var(--gold-deep)}
.castle{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin:6px 18px 18px;position:relative}
.castle .icon{font-size:46px;filter:grayscale(1);opacity:.75;transition:.4s}
.castle.finished{border-color:var(--brand-line);background:var(--brand-soft-2)}
.castle.finished .icon{filter:none;opacity:1}
.castle b{display:block;font-size:18px;margin:4px}
.notice{margin:0 18px 8px;font-size:11px;color:var(--muted);line-height:1.7}
/* generic */
.view{padding:16px}
.view h2{font-size:21px;margin:6px 0 4px;letter-spacing:-.5px}
.view h3{font-size:15px;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:1px solid var(--line-strong);background:var(--card);border-radius:12px;padding:12px 14px;font-size:13px;font-weight:700;min-height:46px;color:var(--ink)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.danger{color:#b3263e;border-color:#e7b3bf}
.btn.block{width:100%}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
select,.input,textarea{width:100%;background:var(--card);border:1px solid var(--line-strong);border-radius:12px;padding:12px;font-size:14px;min-height:46px}
textarea{min-height:160px;resize:vertical;line-height:1.5}
.empty{text-align:center;padding:26px 10px;color:var(--muted);font-size:13px;line-height:1.7}
.empty .big{font-size:36px;display:block;margin-bottom:6px}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;background:var(--brand-soft);color:var(--brand)}
.list-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.list-item .grow{flex:1;min-width:0}
.list-item b{font-size:14px;display:block}
.list-item small{font-size:11px;color:var(--muted)}
.icon-btn{border:1px solid var(--line-strong);background:var(--card);border-radius:10px;min-width:44px;min-height:40px;font-size:12px;font-weight:700;padding:0 10px}
.icon-btn.on{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand)}
/* tab bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tab{position:relative;border:0;background:none;padding:6px 0;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);font-weight:700;min-height:52px;border-radius:12px}
.tab svg{width:24px;height:24px}
.tab[aria-current=page]{color:var(--brand)}
.tab .dot{min-width:16px;height:16px;border-radius:8px;background:var(--brand);color:#fff;font-size:10px;line-height:16px;padding:0 4px;position:absolute;top:2px;left:calc(50% + 6px)}
/* sheet */
.veil{position:fixed;inset:0;background:var(--overlay);z-index:10;display:flex;justify-content:center;align-items:flex-end;animation:fade .2s}
.sheet{width:100%;max-width:480px;max-height:90dvh;background:var(--card);border-radius:26px 26px 0 0;overflow:auto;overscroll-behavior:contain;padding:0 18px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease-out}
.sheet-head{position:sticky;top:0;background:var(--card);padding:10px 0 8px;z-index:1}
.handle{height:4px;background:var(--line-strong);width:36px;border-radius:8px;margin:0 auto 12px}
.sheet h2{font-size:21px;margin:0;letter-spacing:-.5px}
.sheet .sub{font-size:12px;color:var(--muted);margin-top:2px}
.close{border:0;border-radius:50%;background:var(--brand-soft);color:var(--brand);width:40px;height:40px;font-size:22px;flex-shrink:0}
.task{display:flex;align-items:center;gap:10px;margin:8px 0}
.task .main{flex:1;display:flex;align-items:center;gap:12px;padding:12px 10px;border:1px solid var(--line);background:var(--card);border-radius:14px;text-align:left;min-height:62px;min-width:0}
.task .token{filter:grayscale(1);opacity:.5;background:var(--gray-orb);border-radius:12px;padding:8px;font-size:20px;line-height:1}
.task .txt{flex:1;min-width:0}
.task b{font-size:14px;display:block}
.task small{display:block;color:var(--muted);margin-top:3px;font-size:11px}
.task .tick{font-size:20px;color:var(--brand);width:24px;text-align:center}
.task.done .main{background:var(--brand-soft-2);border-color:var(--brand-line)}
.task.done .token{filter:none;opacity:1;background:var(--brand-soft)}
.task .plan{width:56px;min-height:62px;border-radius:14px;border:1px dashed var(--line-strong);background:var(--card);font-size:11px;font-weight:700;color:var(--muted);line-height:1.3}
.task .plan.on{border-style:solid;border-color:var(--gold-deep);background:var(--gold-soft);color:var(--ink)}
.stepper{display:flex;align-items:center;gap:8px;margin:6px 0 14px}
.stepper button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line-strong);background:var(--card);font-size:22px;font-weight:700;color:var(--brand)}
.stepper input{flex:1;text-align:center;font-size:20px;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px 0 14px}
.seg button{border:1px solid var(--line-strong);background:var(--card);border-radius:12px;padding:10px;font-size:13px;font-weight:700;min-height:44px}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
.check-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.check-row input{width:22px;height:22px;margin-top:1px;accent-color:var(--brand);flex-shrink:0}
/* onboarding */
.onboard{padding:24px 20px calc(30px + env(safe-area-inset-bottom))}
.onboard .hero-emoji{font-size:56px;text-align:center;margin:10px 0}
.onboard h2{text-align:center;font-size:24px;margin:4px 0 6px;letter-spacing:-.6px}
.onboard ol{padding-left:20px;line-height:1.9;font-size:14px}
/* toast & fx */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b1019;color:#fff;border-radius:16px;padding:12px 14px 12px 18px;z-index:20;box-shadow:0 8px 28px #0004;font-size:13px;width:max-content;max-width:calc(100vw - 32px);display:flex;gap:12px;align-items:center;animation:pop .25s}
.toast button{background:none;border:0;color:#ffc4d4;font-weight:800;padding:8px;min-height:40px}
.spark{position:fixed;pointer-events:none;z-index:30;font-size:24px;animation:fly 1.1s ease-out forwards}
@keyframes pop{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(150deg);opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:520px){body{padding:20px 0}.app{border-radius:26px;box-shadow:var(--shadow);overflow:hidden;min-height:calc(100dvh - 40px)}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div>
      <small>KHU · SOFTWARE CONVERGENCE</small>
      <h1>졸업 원정대 🧭</h1>
      <p>들은 과목을 톡. 졸업까지 길을 밝혀요.</p>
    </div>
    <button class="chip" id="profileChip" data-act="tab" data-tab="me" hidden></button>
  </header>
  <div id="storageBanner" class="banner" role="alert" hidden>이 브라우저에는 기록이 저장되지 않아요. 설정에서 백업 파일로 보관해 주세요.</div>
  <main id="main">
    <section id="view-onboard" class="onboard" hidden></section>
    <section id="view-map" aria-label="졸업 퀘스트 지도"></section>
    <section id="view-plan" class="view" hidden></section>
    <section id="view-me" class="view" hidden></section>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="주요 메뉴" hidden>
    <button class="tab" data-act="tab" data-tab="map" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>지도</button>
    <button class="tab" data-act="tab" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span id="planDot" class="dot" hidden></span>계획</button>
    <button class="tab" data-act="tab" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>설정</button>
  </nav>
</div>
<div id="veil" class="veil" hidden>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <div class="handle"></div>
      <div class="row"><div><h2 id="sheetTitle"></h2><div class="sub" id="sheetSub"></div></div><button class="close" data-act="close" aria-label="닫기">×</button></div>
    </div>
    <div id="sheetBody"></div>
  </section>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
'use strict';
/* ───────── 교육과정 데이터 (2026-2 소프트웨어융합학과 단일전공 참고 경로 · 2024학번 이후 교양) ───────── */
const APP_VERSION = '1.0.0';

};

const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, Math.round(Number(v) || 0)));

function defaults(){ return {v:2,onboarded:false,year:'2026',track:'data',courses:{},plan:{},credits:0,free:0,dist:{},checks:{}}; }
function sanitize(o, onboarded){
  const s = defaults();
  if (!o || typeof o !== 'object') return s;
  if (YEARS.includes(String(o.year))) s.year = String(o.year);
  if (TRACKS[o.track]) s.track = o.track;
  for (const k of Object.keys(o.courses || {})) if (COURSES.has(k) && o.courses[k] === true) s.courses[k] = true;
  for (const k of Object.keys(o.plan || {})) if (COURSES.has(k) && o.plan[k] === true && !s.courses[k]) s.plan[k] = true;
  s.credits = clamp(o.credits, 0, 180);
  s.free = clamp(o.free, 0, 99);
  for (const a of AREAS) { const v = clamp((o.dist || {})[a], 0, 99); if (v) s.dist[a] = v; }
  for (const id of FINAL.map(f => f[0]).concat('leader12')) if (o.checks && o.checks[id] === true) s.checks[id] = true;
  s.onboarded = onboarded ?? o.onboarded === true;
  return s;
}
let storageOK = true;
function load(){
  try {
    const v2 = localStorage.getItem(KEY);
    if (v2) return sanitize(JSON.parse(v2));

    if (v1) return sanitize(JSON.parse(v1), true); // 이전 버전 기록은 그대로 이어서 사용
  } catch (e) { storageOK = false; }

}

function listOf(id){ return id==='base' ? FOUNDATIONS : id==='must' ? ESSENTIALS : id==='core' ? CORES : id==='choose' ? trackList() : []; }
const earned = l => l.filter(x => S.courses[x[0]]).length;
const distSum = () => AREAS.reduce((a,k) => a + (S.dist[k] || 0), 0);
const distAreas = () => AREAS.filter(k => (S.dist[k] || 0) >= 3).length;
function stat(id){
  switch (id) {
    case 'base': case 'must': { const l = listOf(id), e = earned(l); return {p:e/l.length, done:e===l.length, text:`${e} / ${l.length}과목 완료`}; }
    case 'core': { if (legacy()) return {p:0, done:false, unknown:true, text:'내 학번 기준 확인 필요'}; const e = earned(CORES); return {p:e/CORES.length, done:e===CORES.length, text:`${e} / ${CORES.length}과목 완료`}; }
    case 'choose': {
      const l = trackList(), e = earned(l), leader = S.track === 'leader';
      const tr = leader ? (S.checks.leader12 ? 1 : 0) : e / l.length;
      return {p:(Math.min(S.credits/36,1)+tr)/2, done:S.credits>=36 && tr===1, text: leader ? `${S.credits} / 36학점 · 12과목 ${S.checks.leader12?'확인':'미확인'}` : `${S.credits} / 36학점 · 트랙 ${e} / ${l.length}`};
    }
    case 'dist': { if (legacy()) return {p:0, done:false, unknown:true, text:'내 학번 기준 확인 필요'}; const a = distAreas(), s = distSum(); return {p:(Math.min(a/3,1)+Math.min(s/9,1))/2, done:a>=3 && s>=9, text:`${a} / 3개 영역 · ${s} / 9학점`}; }
    case 'free': { if (legacy()) return {p:0, done:false, unknown:true, text:'내 학번 기준 확인 필요'}; return {p:Math.min(S.free/3,1), done:S.free>=3, text:`${S.free} / 3학점`}; }
    case 'final': { const n = FINAL.filter(f => S.checks[f[0]]).length; return {p:n/5, done:n===5, text:`${n} / 5개 확인`}; }
  }
}

}

let sheet = null, lastFocus = null, parsed = [];

}

let toastTimer, undoSnap = null;

}
function celebrate(x, y, big){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < (big ? 28 : 12); i++) {
    const el = document.createElement('span');
    el.className = 'spark'; el.textContent = ['✨','🌟','🍃','🎉'][i % (big ? 4 : 3)];
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.setProperty('--x', (Math.random()*300-150) + 'px');
    el.style.setProperty('--y', (-80-Math.random()*220) + 'px');
    document.body.append(el); setTimeout(() => el.remove(), 1200);
  }
}
function mutate(fn, e, msg){
  const snap = JSON.stringify(S), before = doneSet();
  fn();
  save(); renderAll();
  const after = doneSet(), gained = QUESTS.filter(q => after.has(q.id) && !before.has(q.id));
  const x = e && e.clientX ? e.clientX : innerWidth/2, y = e && e.clientY ? e.clientY : innerHeight/2;
  if (after.size === 7 && before.size < 7) { toast('🏰 졸업 성 도착! 공식 졸업사정으로 마지막 확인을 해요.', snap); celebrate(x, y, true); }
  else if (gained.length) { toast(`🏆 ${gained[0].name} 퀘스트 달성!`, snap); celebrate(x, y); }

}

const norm = s => String(s).replace(/[\s·・\-\/()（）_.,]/g, '').toUpperCase();
function parseTranscript(text){
  const T = norm(text), out = [];
  for (const c of COURSES.values()) {
    if (c.track && c.track !== S.track) continue;
    const byCode = /\d/.test(c.code) && new RegExp(`(^|[^A-Z0-9])${c.code}($|[^0-9])`, 'i').test(text.toUpperCase());
    const byName = T.includes(norm(c.name));
    if (byCode || byName) out.push({...c, by: byCode ? '코드' : '과목명'});
  }
  return out;
}
function summaryText(){

  L.push(`${S.year}학번 · ${TRACKS[S.track].name} 트랙 (소프트웨어융합학과 단일전공 참고 경로)`);
  L.push(`퀘스트 ${doneSet().size} / 7 완료 · 입력한 학점 합계 ${creditSum()} / 130`);
  L.push('');
  for (const [t,l] of remainingGroups()) L.push(`■ 남은 ${t}: ${l.map(c => `${c[1]}(${c[2]})`).join(', ')}`);
  L.push(`■ 전공선택: ${stat('choose').text}`);
  L.push(legacy() ? '■ 교양(필수·배분·자유): 내 학번 기준 확인 필요' : `■ 배분이수: ${stat('dist').text} · 자유이수: ${stat('free').text}`);
  const pend = FINAL.filter(f => !S.checks[f[0]]).map(f => f[1].replace(/했어요|웠어요/, '').trim());
  if (pend.length) L.push(`■ 아직 확인 안 한 졸업 요건: ${pend.join(' / ')}`);
  const plan = planList();
  if (plan.length) L.push(`■ 다음 학기 계획: ${plan.map(c => c.name).join(', ')} (총 ${plan.reduce((a,c) => a + c.credit, 0)}학점)`);
  L.push('');
  L.push('※ 본인이 입력한 정보 기준이며 공식 졸업사정이 아닙니다. 대체인정·경과조치 확인 부탁드립니다.');
  return L.join('\n');
}

function setField(field, value, delta, e){
  mutate(() => {
    const cur = field === 'credits' ? S.credits : field === 'free' ? S.free : (S.dist[AREAS[+field.split(':')[1]]] || 0);
    const v = delta ? cur + value : value;
    if (field === 'credits') S.credits = clamp(v, 0, 180);
    else if (field === 'free') S.free = clamp(v, 0, 99);
    else if (field.startsWith('dist:')) { const a = AREAS[+field.split(':')[1]], n = clamp(v, 0, 99); if (n) S.dist[a] = n; else delete S.dist[a]; }
    else if (field === 'year' && YEARS.includes(value)) S.year = value;
    else if (field === 'track' && TRACKS[value]) S.track = value;
  }, e);
}

  if (e.key === 'Escape') { closeSheet(); return; }
  if (e.key === 'Tab') {
    const f = [...$('sheet').querySelectorAll('button:not([disabled]),input:not([disabled]),textarea,select')].filter(x => x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length-1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length-1]) { e.preventDefault(); f[0].focus(); }
  }
});
window.addEventListener('storage', e => { if (e.key === KEY) { S = load(); renderAll(); } });
renderAll();
</script>
