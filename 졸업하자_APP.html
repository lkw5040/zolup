<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#720e28"><title>졸업 원정대 · KHU</title><style>
*{box-sizing:border-box}body{margin:0;background:#ece2e5;font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#39232b}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible{outline:3px solid #8b1939;outline-offset:4px}.app{max-width:480px;margin:auto;min-height:100dvh;background:#fbf7f5;position:relative;overflow:hidden}.top{background:#720e28;color:#fff;padding:24px 22px 20px}.top small{color:#e9c8d0;font-weight:700;letter-spacing:2px;font-size:10px}.top h1{margin:8px 0;font-size:27px;letter-spacing:-1px}.top p{color:#f3dde3;font-size:13px;margin:0}.profile{margin:16px 18px 0;display:flex;gap:8px}.profile select{min-width:0;background:white;border:1px solid #e6d4da;border-radius:12px;padding:10px;font-size:12px;flex:1}.hero{margin:16px 18px 0;background:#fff;border:1px solid #eadbe0;border-radius:20px;padding:17px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.hero b{font-size:15px}.hero strong{font-size:24px}.bar{height:8px;background:#eee3e7;border-radius:10px;margin:12px 0;overflow:hidden}.bar i{display:block;background:#9b2345;height:100%;transition:width .4s}.muted{font-size:12px;color:#705d65;line-height:1.6}.next{width:100%;background:#820d30;color:white;border:0;border-radius:12px;padding:13px;margin-top:12px;font-size:13px;font-weight:800}.map{position:relative;padding:30px 22px 0;min-height:650px;background:radial-gradient(ellipse at 10% 28%,#efdae180 0,transparent 33%),radial-gradient(ellipse at 95% 70%,#f0dfe5 0,transparent 35%)}.map:before{content:'';position:absolute;top:45px;bottom:90px;left:50%;width:4px;background:repeating-linear-gradient(to bottom,#d5b6c1 0 8px,transparent 8px 16px)}.stop{position:relative;display:flex;align-items:center;gap:14px;margin-bottom:25px;min-height:77px}.stop:nth-child(even){flex-direction:row-reverse;text-align:right}.orb{width:75px;height:75px;flex-shrink:0;border:5px solid #dfd6d9;background:#f3eff0;box-shadow:0 5px 0 #c9b9bf;border-radius:26px;display:grid;place-items:center;font-size:32px;filter:grayscale(1);transition:.35s;position:relative}.orb.partial{filter:none;border-color:#f0ce76;background:#fff5d4;box-shadow:0 5px 0 #d2ad54}.orb.done{filter:none;border-color:#ce849a;background:#f9e5ec;box-shadow:0 5px 0 #9b3453}.orb.done:after{content:'✓';position:absolute;right:-7px;top:-8px;border:3px solid #fbf7f5;border-radius:50%;background:#820d30;color:white;font-size:14px;width:23px;height:23px;display:grid;place-items:center}.stop .label{background:#ffffffed;border:1px solid #eadde1;border-radius:15px;padding:11px 13px;flex:1;max-width:255px;text-align:left;color:#39232b}.label b{display:block;font-size:14px}.label small{display:block;font-size:11px;color:#76616a;margin-top:4px;line-height:1.5}.label button{border:0;background:none;padding:0;color:inherit;text-align:left;width:100%}.castle{text-align:center;position:relative;background:#fff;border:1px solid #ead9df;border-radius:20px;padding:20px;margin:10px 0 24px}.castle .icon{font-size:46px;filter:grayscale(1)}.castle.finished .icon{filter:none}.castle b{display:block;font-size:18px;margin:5px}.notice{margin:0 18px 22px;font-size:11px;color:#715f65;line-height:1.7}.footer{padding:12px 18px 24px;display:flex;gap:10px}.footer button{flex:1;background:white;border:1px solid #dfcbd3;border-radius:12px;padding:11px;color:#62273b;font-size:12px}.veil{position:fixed;inset:0;background:#30101d80;z-index:10;display:flex;justify-content:center;align-items:end}.sheet{width:100%;max-width:480px;max-height:88dvh;background:#fff;border-radius:26px 26px 0 0;overflow:auto;padding:18px 20px max(25px,env(safe-area-inset-bottom))}.handle{height:4px;background:#d9c6ce;width:36px;border-radius:8px;margin:0 auto 20px}.sheet h2{font-size:23px;margin:0 0 6px;letter-spacing:-.6px}.close{border:0;border-radius:50%;background:#f4e9ee;color:#78213e;width:34px;height:34px;font-size:22px}.tasks{margin-top:18px}.task{display:flex;align-items:center;gap:12px;width:100%;padding:15px 10px;border:1px solid #e9dce2;background:#fff;border-radius:14px;margin:9px 0;text-align:left;color:#512b3a;min-height:64px}.task .token{filter:grayscale(1);opacity:.5;background:#f3ecef;border-radius:12px;padding:9px;font-size:20px}.task.active{background:#fff0f4;border-color:#d796ab}.task.active .token{filter:none;opacity:1;background:#f4ccda}.task b{font-size:13px;display:block}.task small{display:block;color:#745963;margin-top:4px;font-size:11px}.task .tick{margin-left:auto;color:#941c40;font-size:19px}.credit{width:100%;padding:14px;border:1px solid #d7aaba;border-radius:12px;font-size:22px;color:#78213e;margin:13px 0}.save{border:0;border-radius:12px;padding:14px;width:100%;background:#820d30;color:#fff;font-weight:800}.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);background:#720e28;color:#fff;border-radius:16px;padding:14px 20px;z-index:20;box-shadow:0 8px 28px #72122e33;font-size:13px;width:max-content;max-width:90vw;animation:pop .3s}.hide{display:none}.spark{position:fixed;pointer-events:none;z-index:30;font-size:25px;animation:fly 1.1s ease-out forwards}@keyframes pop{from{transform:translate(-50%,-15px);opacity:0}to{transform:translate(-50%,0);opacity:1}}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(150deg);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(min-width:520px){body{padding:20px}.app{border-radius:26px;box-shadow:0 15px 70px #72122e20}}
</style></head><body><div class="app"><header class="top"><small>KHU · SOFTWARE CONVERGENCE</small><h1>졸업 원정대 🧭</h1><p>들은 과목을 톡. 졸업까지 길을 밝혀요.</p></header><div class="profile"><select id="year" aria-label="입학연도"></select><select id="track" aria-label="트랙"><option value="data">데이터사이언스</option><option value="game">게임콘텐츠</option><option value="robot">로봇·비전</option><option value="leader">융합리더</option></select></div><section class="hero"><div class="row"><b>나의 졸업 모험</b><strong id="score">0 / 7</strong></div><div class="bar"><i id="progress"></i></div><div id="hint" class="muted"></div><button id="next" class="next"></button></section><main id="map" class="map" aria-label="졸업 퀘스트 지도"></main><p class="notice">지도 연결은 모험 경로예요. 실제 선수과목 순서를 뜻하지 않아요.<br>배지는 입력한 조건의 달성 표시이며 공식 졸업 판정이 아니에요. 전공은 기존 자료의 2026 단일전공 목록을 사용해요. 이전 학번은 적용 교육과정을 먼저 확인해야 해요. 교양은 2024학번 이후 기준이며 이전 학번은 판정하지 않아요.</p><div class="footer"><button id="help">사용법 · 근거</button><button id="reset">기록 초기화</button></div></div><div id="veil" class="veil hide"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="handle"></div><div class="row"><h2 id="sheetTitle"></h2><button id="close" class="close" aria-label="닫기">×</button></div><div id="sheetBody"></div></section></div><div id="toast" class="toast hide" role="status"></div><script>const foundations=[['AMTH1001','미분방정식',3],['AMTH1004','선형대수',3],['AMTH1009','미분적분학',3],['APHY1002','물리학및실험1',3],['EE211','확률및랜덤변수',3]];const essentials=[['CSE103','객체지향프로그래밍',3],['CSE204','자료구조',3],['CSE301','운영체제',3],['CSE304','알고리즘',3],['CSE305','데이터베이스',3],['CSE327','소프트웨어공학',3],['CSE438','최신기술콜로키움1',2],['SWCON101','소프트웨어융합개론',3],['SWCON103','디자인적사고',3],['SWCON104','웹/파이선프로그래밍',3],['SWCON201','오픈소스SW개발방법및도구',3],['SWCON302','최신기술콜로키움2',2],['SWCON401','소프트웨어융합캡스톤디자인',3],['SWCON402','졸업논문(소프트웨어융합)',0]];const tracks={data:[['SWCON253','기계학습'],['IE','응용통계학'],['SWCON256','데이터분석입문'],['SWCON372','응용데이터분석'],['SWCON321','데이터분석캡스톤디자인']],game:[['SWCON211','게임프로그래밍입문'],['SWCON212','게임엔진기초'],['SWCON311','게임그래픽프로그래밍'],['SWCON315','게임공학'],['SWCON491','인공지능과게임프로그래밍'],['SWCON312','게임인터랙티브테크놀로지'],['SWCON367','게임콘텐츠캡스톤디자인']],robot:[['SWCON291','수치해석프로그래밍'],['SWCON254','회로와신호'],['SWCON366','3D데이터처리'],['SWCON331','로봇프로그래밍'],['SWCON494','영상분석과패턴인식'],['SWCON332','로봇·비전캡스톤디자인']],leader:[]};
const $=id=>document.getElementById(id);const key='khu-quest-v1';let state={year:'2026',track:'data',courses:{},credits:0,free:0,dist:{},checks:{}};try{const loaded=JSON.parse(localStorage.getItem(key));if(loaded&&loaded.courses)state={...state,...loaded}}catch(e){};let active=null,lastFocus=null,toastTimer;
const cores=[['core1','인간의가치탐색',3],['core2','세계와시민',3],['core3','빅뱅에서문명까지',3],['core4','성찰과표현',3],['core5','주제연구',3],['core6','대학영어',2]];const areas=['생명·우주·인간','분석·추론·논리','성·정·문화·소통','사회·공동체·평화','지능·정보·미래'];
function groups(){let tr=tracks[state.track].map(x=>[x[0],x[1],3]);return[{id:'base',icon:'🌱',name:'기초 다지기',formal:'전공기초',list:foundations},{id:'must',icon:'📌',name:'꼭 들어야 할 수업',formal:'전공필수',list:essentials},{id:'choose',icon:'💎',name:'내 전공 깊게 배우기',formal:'전공선택 · 트랙필수',list:tr},{id:'core',icon:'📚',name:'모두의 기본 수업',formal:'필수교양',list:cores},{id:'dist',icon:'🌍',name:'다른 세상 탐험하기',formal:'배분이수',list:[]},{id:'free',icon:'🎨',name:'마음 가는 수업',formal:'자유이수',list:[]},{id:'final',icon:'🏁',name:'졸업 전 마지막 점검',formal:'총학점 · 별도 요건',list:[]}];}
function earned(list){return list.filter(x=>state.courses[x[0]]).length}function done(g){if(g.id==='choose')return state.credits>=36&&earned(g.list)===g.list.length&&(state.track!=='leader'||state.checks.leader12);if(g.id==='core')return +state.year>=2024&&earned(g.list)===g.list.length;if(g.id==='dist')return +state.year>=2024&&areas.filter(a=>state.dist[a]>=3).length>=3&&Object.values(state.dist).reduce((a,b)=>a+b,0)>=9;if(g.id==='free')return +state.year>=2024&&state.free>=3;if(g.id==='final')return ['total','english','sw','thesis','extra'].every(x=>state.checks[x]);return earned(g.list)===g.list.length}function detail(g){if(g.id==='choose')return `${state.credits} / 36학점 · 트랙 ${earned(g.list)} / ${g.list.length}과목`;if(g.id==='dist')return +state.year<2024?'내 학번 기준 확인 필요':`${areas.filter(a=>state.dist[a]>=3).length} / 3개 영역 · ${Object.values(state.dist).reduce((a,b)=>a+b,0)} / 9학점`;if(g.id==='free')return +state.year<2024?'내 학번 기준 확인 필요':`${state.free} / 3학점`;if(g.id==='core'&&+state.year<2024)return '내 학번 기준 확인 필요';if(g.id==='final')return `${['total','english','sw','thesis','extra'].filter(x=>state.checks[x]).length} / 5개 확인`;return `${earned(g.list)} / ${g.list.length}과목 완료`}
function store(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){notify('기기에 저장하지 못했어요. 현재 화면에서는 사용할 수 있어요.')}}function render(){const gs=groups(),count=gs.filter(done).length;$('score').textContent=count+' / 7';$('progress').style.width=count/7*100+'%';$('hint').textContent=+state.year<2026?'입학연도와 적용 교육과정은 달라질 수 있어요. 이 지도는 2026 전공 참고 경로예요.':'단일전공 참고 경로 · 검색 없이 들은 수업을 눌러요.';let next=gs.find(g=>!done(g));$('next').textContent=next?'이어 하기 → '+next.name:'🎉 배지 모두 모았어요 · 공식 확인하기';$('next').onclick=()=>open(next?next.id:'final');$('map').innerHTML=gs.map(g=>`<div class="stop"><button class="orb ${done(g)?'done':(g.list.length&&earned(g.list)>0?'partial':'')}" data-open="${g.id}" aria-label="${g.name}, ${detail(g)}">${g.icon}</button><div class="label"><button data-open="${g.id}"><b>${g.name} ${done(g)?'✓':''}</b><small>${g.formal}<br>${detail(g)}</small></button></div></div>`).join('')+`<div class="castle ${count===7?'finished':''}"><span class="icon">🏰</span><b>졸업 성</b><div class="muted">${count===7?'모험 기록 완료! 공식 졸업사정으로 마지막 확인을 해요.':'7개의 배지를 모아 졸업 성으로!'}</div></div>`;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>open(b.dataset.open));}
function task(id,name,subtitle,icon='📘'){return `<button class="task ${state.courses[id]?'active':''}" data-course="${id}" aria-pressed="${!!state.courses[id]}"><span class="token">${icon}</span><span><b>${name}</b><small>${subtitle}</small></span><span class="tick">${state.courses[id]?'✓':'○'}</span></button>`}function check(id,name,subtitle){return `<button class="task ${state.checks[id]?'active':''}" data-check="${id}" aria-pressed="${!!state.checks[id]}"><span class="token">⭐</span><span><b>${name}</b><small>${subtitle}</small></span><span class="tick">${state.checks[id]?'✓':'○'}</span></button>`}
function open(id){active=id;lastFocus=document.activeElement;paintSheet();$('veil').classList.remove('hide');$('close').focus();document.body.style.overflow='hidden'}function paintSheet(){const g=groups().find(x=>x.id===active);$('sheetTitle').textContent=g.icon+' '+g.name;let html='<p class="muted">이미 이수한 수업을 누르면 완료! 다시 누르면 취소돼요.</p>';if(g.id==='core')html+='<p class="muted">2024학번 이후 필수 6과목·17학점 기준. 주제연구 전에 성찰과표현을 이수해야 해요. 영어 대체·면제는 학교 확인이 필요해요.</p>';html+='<div class="tasks">'+g.list.map(x=>task(x[0],x[1],x[2]+'학점',g.icon)).join('')+'</div>';if(g.id==='choose')html+=`<label class="muted" for="credits">전공선택 총 이수학점 (트랙 과목 포함)</label><input id="credits" class="credit" type="number" inputmode="numeric" min="0" max="180" value="${state.credits}">${state.track==='leader'?check('leader12','선택 과목 12개 이상 들었어요','융합리더는 학점과 과목 수를 함께 확인해요'):''}<button class="save" data-save="credits">학점 반영하기</button><p class="muted">학점 합산만으로 과목 대체인정은 확정하지 않아요.</p>`;if(g.id==='dist')html='<p class="muted">2024학번 이후: 5개 영역 중 3개 이상, 총 9학점 이상. 성적표에 적힌 영역에 학점을 넣으세요. 과목명을 검색할 필요 없어요.</p>'+areas.map((a,i)=>`<label class="muted" for="area${i}">${a}</label><input class="credit" id="area${i}" type="number" inputmode="numeric" min="0" max="99" value="${state.dist[a]||0}">`).join('')+'<button class="save" data-save="dist">탐험 기록 반영하기</button><p class="muted">실제 과목별 영역 목록이 없어 자동 분류하지 않아요. 같은 과목을 두 영역에 중복 입력하지 마세요.</p>';if(g.id==='free')html=`<p class="muted">자유이수는 2024학번 이후 3학점 이상이에요. 성적표의 자유이수 학점을 입력하세요.</p><label for="freeCredit" class="muted">자유이수 이수학점</label><input id="freeCredit" class="credit" type="number" inputmode="numeric" min="0" max="99" value="${state.free}"><button class="save" data-save="free">기록 반영하기</button>`;if(g.id==='final')html='<p class="muted">마지막은 직접 확인하는 퀘스트예요. 학교 졸업사정 결과와 비교해 주세요.</p>'+check('total','총 130학점을 채웠어요','전공과 교양을 포함한 전체 취득학점')+check('english','전공 영어 수업을 확인했어요','기본 3과목 · 편입생은 별도 기준 확인')+check('sw','SW교양·SW코딩을 확인했어요','6학점 기준과 본인의 예외 여부 확인')+check('thesis','캡스톤·졸업논문을 확인했어요','수강 순서·논문 제출·산학필수 인정 확인')+check('extra','추가 졸업 조건을 확인했어요','2026: 다전공·부전공·마이크로디그리 / 그 외 경과조치 확인');$('sheetBody').innerHTML=html;document.querySelectorAll('[data-course]').forEach(b=>b.onclick=e=>change(()=>state.courses[b.dataset.course]=!state.courses[b.dataset.course],e));document.querySelectorAll('[data-check]').forEach(b=>b.onclick=e=>change(()=>state.checks[b.dataset.check]=!state.checks[b.dataset.check],e));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=e=>change(()=>{let kind=b.dataset.save;if(kind==='credits')state.credits=Math.max(0,Math.min(180,+$('credits').value||0));if(kind==='free')state.free=Math.max(0,Math.min(99,+$('freeCredit').value||0));if(kind==='dist')areas.forEach((a,i)=>state.dist[a]=Math.max(0,Math.min(99,+$('area'+i).value||0)))},e));}
function change(fn,e){let g=groups().find(x=>x.id===active),before=done(g),course=e.currentTarget.dataset.course,checkId=e.currentTarget.dataset.check;fn();store();render();paintSheet();let after=done(groups().find(x=>x.id===active));if(!before&&after){notify('🏆 '+g.name+' 퀘스트 달성!');celebrate(e.clientX||innerWidth/2,e.clientY||innerHeight/2)}else if(course&&state.courses[course])notify('✨ 수업 완료! 길이 조금 더 밝아졌어요.');else if(course)notify('완료 표시를 취소했어요.');if(course||checkId){let btn=document.querySelector(course?`[data-course="${course}"]`:`[data-check="${checkId}"]`);btn?.focus()}}
function celebrate(x,y){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<12;i++){let el=document.createElement('span');el.className='spark';el.textContent=['✨','🌟','🍃'][i%3];el.style.left=x+'px';el.style.top=y+'px';el.style.setProperty('--x',(Math.random()*280-140)+'px');el.style.setProperty('--y',(-80-Math.random()*200)+'px');document.body.append(el);setTimeout(()=>el.remove(),1200)}}function notify(t){clearTimeout(toastTimer);$('toast').textContent=t;$('toast').classList.remove('hide');toastTimer=setTimeout(()=>$('toast').classList.add('hide'),2300)}function close(){$('veil').classList.add('hide');document.body.style.overflow='';lastFocus?.focus()};$('close').onclick=close;$('veil').onclick=e=>{if(e.target===$('veil'))close()};document.addEventListener('keydown',e=>{if($('veil').classList.contains('hide'))return;if(e.key==='Escape')close();if(e.key==='Tab'){let focus=[...$('veil').querySelectorAll('button,input')],first=focus[0],last=focus[focus.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});$('year').innerHTML=Array.from({length:7},(_,i)=>2020+i).map(y=>`<option value="${y}">${y}학번</option>`).join('');$('year').value=state.year;$('track').value=state.track;$('year').onchange=()=>{state.year=$('year').value;store();render()};$('track').onchange=()=>{state.track=$('track').value;store();render()};$('reset').onclick=()=>{if(confirm('이 기기에 저장한 완료 표시와 학점을 지울까요?')){state={...state,courses:{},credits:0,free:0,dist:{},checks:{}};store();render()}};$('help').onclick=()=>{lastFocus=document.activeElement;$('sheetTitle').textContent='🧭 모험 사용법';$('sheetBody').innerHTML='<p class="muted">① 지도에서 구역을 누르세요.<br>② 이미 들은 수업을 톡 누르세요.<br>③ 수업 배지가 색을 되찾아요.<br>④ 구역을 모두 채우면 버건디 배지가 생겨요.<br><br>검색창 없이 모든 필수 과목을 보여줘요. 배분·자유이수는 검증된 전체 과목 목록이 없어 성적표의 영역별 학점을 입력해요. 완료 취소는 같은 수업을 다시 누르면 돼요.<br><br><b>설계 참고</b><br>듀오링고의 단계형 학습 경로, Candy Crush의 스테이지 지도, RPG의 퀘스트 완료 배지를 참고한 독자적 UI예요. 학습 스트릭이나 유료 보상은 넣지 않았어요.<br><br><b>근거와 적용 범위</b><br>첨부 2026-2 소프트웨어융합학과 교육과정의 단일전공 목록과 이전에 반영한 2024학번 이후 교양 기준을 사용해요. 과거 학번별 필수 목록·대체인정과 전체 배분 과목은 아직 검증 전이에요. 공식 졸업사정을 대체하지 않아요.<br><br><b>저장</b><br>이 기기에만 자동 저장해요. 이전 앱의 불확실한 교양 분류 기록은 자동 이전하지 않아요.<br><br><b>앱 형태</b><br>모바일 웹앱 프로토타입이에요. 아직 앱스토어 앱이나 공개 접속 URL은 아니에요. 공개 배포·설치형 앱 전환은 별도 단계예요.</p>';$('veil').classList.remove('hide');document.body.style.overflow='hidden';$('close').focus()};render();
